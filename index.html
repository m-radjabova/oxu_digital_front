    <script>
      // Tungi rejim React yuklanishidan oldin qo'yiladi — sahifa oq bo'lib "miltillamaydi" (ThemeProvider bilan bir xil kalit)
      try {
        var stored = localStorage.getItem('oxu-theme')
        var dark = stored === 'dark' || ((!stored || stored === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (error) {}
    </script>
